<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e1116" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>glance-cal · add</title>
    <link rel="stylesheet" href="entry.css" />
  </head>
  <body>
    <header>
      <h1>glance-cal</h1>
      <span id="mode" class="pill"></span>
    </header>

    <form id="form">
      <input type="hidden" id="id" />

      <label class="field">
        <span>Title</span>
        <input id="title" type="text" placeholder="What is it?" autocomplete="off" required />
      </label>

      <div class="seg" id="type">
        <button type="button" data-type="event" class="active">Event</button>
        <button type="button" data-type="todo">To-do</button>
      </div>

      <div class="row" id="when-event">
        <label class="field">
          <span>Start</span>
          <input id="start" type="datetime-local" required />
        </label>
        <label class="field">
          <span>End</span>
          <input id="end" type="datetime-local" />
        </label>
      </div>

      <label class="field" id="when-todo" hidden>
        <span>Due</span>
        <input id="due" type="date" />
      </label>

      <label class="field">
        <span>Category</span>
        <div class="cats" id="cats"></div>
      </label>

      <div class="row">
        <label class="field">
          <span>Priority</span>
          <select id="priority">
            <option value="0">None</option>
            <option value="1">Low ▴</option>
            <option value="2">Med ▴▴</option>
            <option value="3">High ▴▴▴</option>
          </select>
        </label>
        <label class="field">
          <span>Status</span>
          <select id="status">
            <option value="todo">To do</option>
            <option value="doing">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>Notes</span>
        <textarea id="notes" rows="2" placeholder="Optional"></textarea>
      </label>

      <div class="actions">
        <button type="button" id="delete" class="danger" hidden>Delete</button>
        <button type="submit" id="save">Add to calendar</button>
      </div>
    </form>

    <section id="list">
      <h2>This week</h2>
      <ul id="items"></ul>
    </section>

    <script type="module" src="entry.js"></script>
  </body>
</html>
